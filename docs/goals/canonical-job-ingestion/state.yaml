      commands:
        - command: "PYTHONPATH=tests python3 -m unittest -v test_job_apply_store.StoreTests.test_job_upsert_preview_commit_cli_walkthrough test_job_apply_store.StoreTests.test_job_upsert_identity_conflicts_are_deterministic test_job_apply_store.StoreTests.test_job_upsert_preserves_human_edits_and_records_provenance test_job_apply_store.StoreTests.test_job_upsert_preview_is_non_mutating_and_rejects_drift test_job_apply_store.StoreTests.test_job_upsert_partial_records_remain_saved"
