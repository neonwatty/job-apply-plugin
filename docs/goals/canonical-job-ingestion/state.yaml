# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Canonical Job Ingestion"
  slug: "canonical-job-ingestion"
  kind: existing_plan
  tranche: "Deliver and verify one complete canonical human-and-agent job ingestion path."
  status: done
  oracle:
    signal: "A temporary-store CLI walkthrough proves preview, idempotent commit, deterministic conflicts, provenance, and preservation of human edits across human and agent inputs."
    cadence: "after the Worker package and at final audit"
    final_proof: "Passing focused and full regression suites plus a receipt containing the successful isolated CLI walkthrough and its expected record outcomes."
  intake:
    original_request: "Use Goal Prep to plan the appropriate slice after the durable shared store."
    interpreted_outcome: "Humans and agents can safely ingest jobs into the same canonical durable records that the CLI and future UX use."
    input_shape: existing_plan
    audience: "Job seekers and their supervised application agents"
    authority: approved
    proof_type: demo
    completion_proof: "Automated tests and a clean isolated CLI demo satisfy every oracle condition."
    likely_misfire: "Ship internal upsert helpers without a usable end-to-end ingestion path, or sprawl into migration, claiming, browser automation, or frontend work."
    blind_spots_considered:
      - "URL/source-ID identity conflicts"
      - "Partial discoveries and readiness"
      - "Field provenance and human-edit precedence"
      - "Preview/commit drift and concurrent writes"
      - "Legacy Markdown migration"
    existing_plan_facts:
      - "The shared-workspace spec and durable-store primitives are already committed and pushed on codex/shared-job-workspace."
      - "The selected next slice is canonical ingestion."
      - "Completion requires automated tests plus a CLI demo."
      - "Historical Markdown migration is explicitly excluded."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/canonical-job-ingestion/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal /Users/neonwatty/Desktop/job-apply-plugin/docs/goals/canonical-job-ingestion"

active_task: null

tasks:
  - id: T001
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the existing canonical-ingestion plan against the current durable-store contracts and specify the largest safe useful Worker package."
    inputs:
      - "docs/superpowers/specs/2026-08-24-shared-job-workspace-design.md"
      - "scripts/job-apply-store.py"
      - "tests/test_job_apply_store.py"
      - "skills/job-search/SKILL.md"
    constraints:
      - "Read-only; do not implement."
      - "Preserve the agreed tranche and explicit non-goals."
      - "Resolve identity, precedence, provenance, preview/commit, and compatibility ambiguities before writes."
    expected_output:
      - "Validated ingestion contract and decision"
      - "Exact Worker objective"
      - "Exact allowed_files"
      - "Focused and regression verify commands"
      - "Stop conditions and deferred work"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Approved as one vertical CLI-integration slice, provided T002 adopts the contract below. The store already supplies atomic writes, locking, URL normalization, revisions, partial saved jobs, and JSON commands. The missing outcome is a previewed bulk upsert that resolves URL/source identity deterministically, protects human fields, records inspectable provenance, and replaces the Markdown queue handoff in job-search. Preview tokens must bind the normalized input and current jobs document; commit must revalidate under the existing global store lock and perform at most one jobs.json replacement. Claiming, migration, browser changes, and UX remain separate milestones."
      worker_package:
        objective: "Implement the complete canonical ingestion path with job-upsert-preview and job-upsert-commit CLI commands. Both accept --origin human|agent and an input object containing a jobs array. Preview performs no durable mutation and returns per-item create, update, noop, conflict, or invalid decisions plus an opaque token. Commit requires that token, replans under the store lock, rejects drift, and atomically applies all actionable records in one jobs.json replacement. Fresh preview plus repeated commit must be a no-op. Connect job-search's confirmed queue action to this path while retaining timestamped Markdown only as a compatibility artifact."
        allowed_files:
          - scripts/job-apply-store.py
          - tests/test_job_apply_store.py
          - skills/job-search/SKILL.md
        verify:
          - "python3 -m unittest -v tests.test_job_apply_store.StoreTests.test_job_upsert_preview_commit_cli_walkthrough tests.test_job_apply_store.StoreTests.test_job_upsert_identity_conflicts_are_deterministic tests.test_job_apply_store.StoreTests.test_job_upsert_preserves_human_edits_and_records_provenance tests.test_job_apply_store.StoreTests.test_job_upsert_preview_is_non_mutating_and_rejects_drift tests.test_job_apply_store.StoreTests.test_job_upsert_partial_records_remain_saved"
          - "python3 -m unittest -v tests.test_job_apply_store"
          - "python3 -m unittest discover -s tests -v"
          - "bash scripts/smoke-plugin.sh"
          - "Run the approved isolated mktemp-backed CLI walkthrough and record the oracle evidence."
        stop_if:
          - "Implementation requires changing the existing URL normalizer or rewriting normalizedUrl values in existing records."
          - "Provenance cannot be added backward-compatibly inside the existing provenance object while treating missing or unrecognized field provenance as human-authoritative."
          - "A URL identity and a (normalized source, sourceId) identity resolve to different records; report a conflict and do not invent a merge rule."
          - "Preview requires initialization, lock-file creation, timestamp updates, or any other durable mutation after the baseline store has been initialized."
          - "The workflow requires files outside allowed_files, a new schema version, destructive migration, or browser automation changes."
          - "Focused verification fails twice because of changes introduced by this slice."
      evidence:
        - "docs/superpowers/specs/2026-08-24-shared-job-workspace-design.md:43-59"
        - "docs/superpowers/specs/2026-08-24-shared-job-workspace-design.md:160-171"
        - "scripts/job-apply-store.py:214-232,446-518,1190-1256,1340-1396"
        - "tests/test_job_apply_store.py:356-402,844-885"
        - "skills/job-search/SKILL.md:243-328"
      parallel_safety:
        safe: false
        reason: "Store implementation, tests, and job-search instructions define one coupled public contract."
      blocked_tasks: []
      missing_evidence:
        - "T002 must supply implementation, focused and regression results, and the isolated CLI walkthrough."
      required_board_updates:
        - "Activate T002 as the sole active task; leave T999 queued."
