      - "The workflow requires files outside allowed_files, a new schema version, destructive migration, or browser automation changes."
      - "Focused verification fails twice because of changes introduced by this slice."
    contract:
      identity:
        - "Use the existing normalize_job_url result unchanged as one identity."
        - "Use (source.strip().lower(), sourceId.strip()) as a second identity only when both values exist."
        - "If URL and source identity resolve to the same active record, merge into that record."
        - "If they resolve to different records, multiple records, a trashed record, or an existing record with incompatible non-empty identity fields, return conflict with zero mutation for that item."
        - "Plan duplicate batch entries against an in-memory simulated document so identical entries collapse deterministically and differing entries conflict."
        - "Generate deterministic opaque IDs for new ingestion records so preview can report the eventual ID."
      precedence:
        - "New jobs always start as saved; ingestion never changes status, closedOutcome, resumeId, or deletion state."
        - "Empty or absent incoming metadata never clears a stored value."
        - "Human input may replace enrichable metadata and must stamp human provenance."
        - "Agent input may fill empty fields or replace fields whose current provenance is agent-authored."
        - "Agent input must preserve fields with human provenance; a non-empty field lacking recognized provenance is treated as human-authored."
        - "Existing job-create and job-update calls default to human origin and must stamp changed fields accordingly; an explicit agent origin uses the same lower-authority merge rules."
      provenance:
        - "Store current field provenance under JSON-pointer keys in the existing provenance object."
        - "Each managed entry records origin (human or agent), observation source (manual or the normalized job source), and updatedAt."
        - "Preserve unknown provenance keys for version-1 compatibility."
        - "Do not retain an unbounded observation history or duplicate full job snapshots."
      preview_commit:
        - "Preview validates each item and returns counts and stable per-item decisions without changing any store file."
        - "The preview token hashes canonical input, origin, and the exact jobs-document snapshot."
        - "Commit acquires the existing store lock, reloads jobs.json, verifies the token, and fails closed on drift before mutation."
        - "Conflicting or invalid items remain unchanged; actionable items are committed together with one atomic jobs.json replacement."
        - "If every item is noop, commit must not rewrite jobs.json."
      compatibility:
        - "Preserve existing job-create, job-get, job-list, job-update, transition, trash, restore, and delete behavior and JSON output."
        - "Job-search continues terminal and timestamped Markdown output, maps only supported canonical fields into structured ingestion, previews before asking for confirmation, and commits only after confirmation."
        - "application_queue.md is no longer the authoritative queue handoff; score, connections, hiring-manager details, and other unsupported search-only fields remain in the compatibility report for this slice."
    receipt:
      result: done
      changed_files:
