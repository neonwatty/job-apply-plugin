        - command: "mktemp-backed CLI walkthrough: init; human preview/commit; agent enrichment preview/commit; human role edit; conflicting agent preview; fresh replay preview/commit; job-get; job-list"
          status: pass
          result: "Oracle evidence captured"
      summary: "Implemented canonical human/agent bulk ingestion with deterministic identity resolution, per-item decisions, provenance-aware precedence, non-mutating previews, drift-bound tokens, locked replanning, and one atomic replacement. Direct create/update commands now stamp provenance and support agent precedence. Job-search previews structured agent input before confirmation and treats timestamped Markdown as compatibility output. Focused, store, full regression, smoke, and isolated CLI evidence all pass."
