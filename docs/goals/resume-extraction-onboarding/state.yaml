      rationale: "Focused suites pass, and inspection supports schema closure, value-free request/completion output, content-token staleness, single-winner completion, and legacy proposal behavior. However, resume-byte replacement is not crash-safe. `update_resume` installs new bytes and writes the extraction journal, while `initialize` reconciles resume files against the old resumes document before rolling that journal forward. A process death after journal creation but before `resumes.json` can restore old bytes, then commit new metadata, leaving mismatched content. Current recovery tests cover completion and trash and simulate caught exceptions, not this hard-interruption boundary. T004 must remain blocked pending repair and re-audit."
