version: 2

goal:
  title: "Resume Extraction Onboarding"
  slug: "resume-extraction-onboarding"
  kind: existing_plan
  tranche: "Continuously implement and verify the complete approved resume extraction request and profile preparedness plan."
  status: done
  oracle:
    signal: "The redacted-resume human request to agent completion to grouped review workflow passes its deterministic oracle, full regressions, packaged checks, and fresh-agent stop-at-review acceptance."
    cadence: "after each Worker package and at final audit"
    final_proof: "Receipts prove shared request/profile state, safe auto-fill and review, content staleness, cancellation/concurrency/recovery, value-free new outputs, browser boundary enforcement, and green Python, Node/browser, packaging, Linux, macOS, and Windows gates."
  intake:
    original_request: "Plan and build the missing UX-triggered resume extraction and onboarding workflow."
    interpreted_outcome: "A person and Job Apply agent share one durable extraction-request, proposal-review, profile, and preparedness workflow through the canonical Store."
    input_shape: existing_plan
    audience: "Job Apply users and Job Apply agents"
    authority: approved
    proof_type: demo
    completion_proof: "The deterministic redacted-resume oracle returns passed true, all required suites are green, and a fresh skill-driven agent completes only through proposal/review without private owner data or an application browser action."
    likely_misfire: "Shipping a polished but browser-only queue, or declaring success after storage/API work without proving the full human-agent-human loop."
    blind_spots_considered:
      - "A queued request must not pretend an agent is actively extracting."
      - "The existing opaque resume contentRevision must be reused; cosmetic metadata edits must not stale work."
      - "Concurrent completion, cancellation, profile drift, and crash recovery must produce no partial write."
      - "The browser must not complete/fail extraction or inject candidate/profile-revision data."
      - "Existing explicitly invoked profile/proposal detail remains value-bearing while new request/preparedness outputs stay value-free."
      - "Structured arrays require replacement confirmation and unknown facts remain visible in Additional."
    existing_plan_facts:
      - "Approved design: docs/superpowers/specs/2026-09-03-resume-extraction-onboarding-design.md"
      - "Detailed plan: docs/superpowers/plans/2026-09-03-resume-extraction-onboarding.md"
      - "Implement Store/CLI requests and atomic proposal completion before consumers."
      - "Implement shared preparedness and authenticated Companion API after the Store contract is fixed."
      - "Implement Resumes request/handoff and Facts readiness/grouped review against the fixed API."
      - "Finish with agent instructions, packaged contracts, deterministic oracle, full regression, and fresh-agent acceptance."
      - "A PR, merge, install, promotion, tag, or release is outside this local implementation tranche."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

