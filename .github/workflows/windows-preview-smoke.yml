name: Windows Preview Install
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/windows-preview-smoke.yml'
      - 'scripts/smoke/windows-preview.mjs'
permissions:
  contents: read
jobs:
  marketplace-install:
    name: Windows x64 preview (${{ matrix.host }})
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: codex
            package: '@openai/codex'
          - host: claude
            package: '@anthropic-ai/claude-code'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: preview-source
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: x64
      - run: npm install --global '${{ matrix.package }}'
      - run: node scripts/smoke/windows-preview.mjs '${{ matrix.host }}' preview-source
