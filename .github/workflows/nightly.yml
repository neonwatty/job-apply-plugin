name: Nightly Validation

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:full -- --receipt ci-receipts/nightly-full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-full-${{ github.run_id }}
          path: ci-receipts/nightly-full.json
          if-no-files-found: error
          retention-days: 14

  macos-live-advisory:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - name: Advisory observed browser, Store, and native account walkthrough
        continue-on-error: true
        env:
          JOB_APPLY_OWNER_APPROVED_VISIBLE_BROWSER_TESTS: '1'
        run: python3 scripts/qa-account.py verify-all --provider macos-keychain --owner-approved-visible-browser-tests --json
      - name: Advisory Oracle email-only observation
        continue-on-error: true
        env:
          JOB_APPLY_OWNER_APPROVED_VISIBLE_BROWSER_TESTS: '1'
        run: python3 scripts/qa-account.py verify-oracle-email-only --automation-provider macos-accessibility --owner-approved-visible-browser-tests --json
