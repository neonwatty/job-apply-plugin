name: Validate Plugin
on:
  workflow_dispatch:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node tools/ci/classify.mjs --base "$BASE_REF" --receipt ci-receipts/selection.json
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      - uses: actions/upload-artifact@v7
        with:
          name: selection
          path: ci-receipts/selection.json
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:size -- --base "$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      - name: Check migration inventory
        shell: bash
        run: |
          set -o pipefail
          npm --silent run check:migration 2>&1 | tee "$RUNNER_TEMP/migration-inventory.log"
      - run: npm run test:fast -- --concurrency 1 --receipt ci-receipts/fast.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: policy
          path: |
            ci-receipts/fast.json
            ${{ runner.temp }}/migration-inventory.log
  native-shards:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        suite: [node-native-unit, node-native-cli, node-native-browser]
        include:
          - os: macos-latest
            suite: macos-native-typescript-adapter
          - os: macos-latest
            suite: macos-native-source
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/ci/run-suite.mjs "${{ matrix.suite }}" ci-receipts/native.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.suite }}
          path: ci-receipts/native.json
  package-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g @anthropic-ai/claude-code @openai/codex
      - run: npm run test:release -- --receipt ci-receipts/release.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: package-${{ matrix.os }}
          path: ci-receipts/release.json
  windows-native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: npx --yes node-gyp install
      - name: Verify the packaged Windows lock
        run: node -e "import('./runtime/package/native-lock-artifact.js').then(m => m.resolvePackagedNativeLock(process.cwd())).then(p => console.log(p))"
      - run: node --test tests_js/windows_native_lock.test.mjs tests_js/native_installed_entrypoints.test.mjs
  pr-gate:
    name: PR gate
    if: always()
    needs: [classify, policy, native-shards, package-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node tools/ci/gate.mjs
        env:
          CI_RESULTS_JSON: ${{ toJSON(needs) }}
          CI_SELECTED_JOBS: '["classify","policy","native-shards","package-contract"]'
