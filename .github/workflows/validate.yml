name: Validate Plugin

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected-suites: ${{ steps.selection.outputs.selected_suites }}
      fallback: ${{ steps.selection.outputs.fallback }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - id: selection
        name: Record affected selection in shadow mode
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci/classify.mjs --base "$BASE_REF" --receipt ci-receipts/selection.json --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-selection-${{ github.run_id }}
          path: ci-receipts/selection.json
          if-no-files-found: error
          retention-days: 14

  policy:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check:size -- --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: "Shadow only: full deterministic shards still execute"
        run: npm run test:fast -- --receipt ci-receipts/fast.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-receipt-${{ github.run_id }}
          path: ci-receipts/fast.json
          if-no-files-found: error
          retention-days: 14

  python-shards:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [python-qa, python-workspace-contracts, python-accounts, python-core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tools/ci/run-suite.mjs "${{ matrix.suite }}" "ci-receipts/${{ matrix.suite }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-${{ github.run_id }}
          path: ci-receipts/${{ matrix.suite }}.json
          if-no-files-found: error
          retention-days: 14

  browser-shards:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [node-recorder, node-renderer, node-workspace-other]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node tools/ci/run-suite.mjs "${{ matrix.suite }}" "ci-receipts/${{ matrix.suite }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-${{ github.run_id }}
          path: ci-receipts/${{ matrix.suite }}.json
          if-no-files-found: error
          retention-days: 14

  package-contract:
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm install -g @anthropic-ai/claude-code @openai/codex
      - run: node tools/ci/run-suite.mjs release-package ci-receipts/release-package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-contract-${{ github.run_id }}
          path: ci-receipts/release-package.json
          if-no-files-found: error
          retention-days: 14

  windows-store-workspace:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original Windows account modules
        run: python -m unittest -v tests.test_job_apply_accounts tests.test_job_apply_credentials tests.test_job_apply_account_executor tests.test_job_apply_account_canary tests.test_job_apply_account_canary_executor tests.test_job_apply_account_flows tests.test_qa_account
      - name: Verify split Store modules replacing the original monolith
        run: python -m unittest discover -s tests -p 'test_store_*.py' -v
      - name: Verify split workspace modules replacing the original monolith
        run: python -m unittest discover -s tests -p 'test_job_apply_workspace_*.py' -v
      - run: npm run qa:resume-extraction-onboarding

  macos-credential-helper:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Typecheck isolated Security.framework helper
        run: xcrun swiftc -typecheck native/macos/job_apply_credential_helper.swift native/macos/job_apply_browser_bridge.swift native/macos/OracleExecutableIdentity.swift native/macos/NativeEmailOnlyBinding.swift native/macos/AccessibilityTree.swift native/macos/ReviewedAccountForm.swift native/macos/OracleBrowserIdentity.swift native/macos/MacOSAccessibilityAccountFlowHelper.swift native/macos/OracleAccountFlowFixtures.swift native/macos/job_apply_credential_helper_tests.swift native/macos/job_apply_credential_helper_main.swift
      - run: python3 -m unittest -v tests.test_macos_credential_helper tests.test_macos_account_flow_helper
      - run: npm run qa:resume-extraction-onboarding

  macos-account-flow-helper:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify reviewed Workday account boundary
        run: |
          xcrun swiftc -typecheck native/macos/job_apply_credential_helper.swift native/macos/job_apply_browser_bridge.swift native/macos/OracleExecutableIdentity.swift native/macos/NativeEmailOnlyBinding.swift native/macos/AccessibilityTree.swift native/macos/ReviewedAccountForm.swift native/macos/OracleBrowserIdentity.swift native/macos/MacOSAccessibilityAccountFlowHelper.swift native/macos/OracleAccountFlowFixtures.swift native/macos/job_apply_workday_account_flow_helper.swift native/macos/job_apply_workday_account_flow_main.swift
          python3 -m unittest -v tests.test_macos_workday_account_flow_helper
      - run: npm run qa:resume-extraction-onboarding

  pr-gate:
    name: PR gate
    if: always()
    needs: [classify, policy, python-shards, browser-shards, package-contract, windows-store-workspace, macos-credential-helper, macos-account-flow-helper]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every parallel validation job
        env:
          CI_RESULTS_JSON: ${{ toJSON(needs) }}
          CI_SELECTED_JOBS: '["classify","policy","python-shards","browser-shards","package-contract","windows-store-workspace","macos-credential-helper","macos-account-flow-helper"]'
        run: node tools/ci/gate.mjs
