name: Release Validation
on:
  push:
    branches: [main, staging]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      checkout_sha:
        description: Exact candidate SHA. Defaults to the selected ref's commit.
        type: string
  workflow_call:
    inputs:
      checkout_sha:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-validation-${{ github.event_name }}-${{ github.ref }}-${{ inputs.checkout_sha }}
  cancel-in-progress: true
jobs:
  installed-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Require a full checkout SHA
        if: inputs.checkout_sha != ''
        env:
          CHECKOUT_SHA: ${{ inputs.checkout_sha }}
        run: |
          if [[ ! "$CHECKOUT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "checkout_sha must be a full commit SHA"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm install -g @anthropic-ai/claude-code @openai/codex
      - run: npm run test:release -- --receipt ci-receipts/release.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-${{ matrix.os }}
          path: ci-receipts/release.json
